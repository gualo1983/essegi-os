# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: essegi-os
description: Sistema minimale immutabile ottimizzato.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44

modules:
#  - type: systemd
#    system:
#      - path: /etc/systemd/system.conf.d/optimizations.conf
#        content: |
#          [Manager]
#          DefaultTimeoutStartSec=15s
#          DefaultTimeoutStopSec=15s
